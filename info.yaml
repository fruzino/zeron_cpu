yaml_version: 6

project:
  title:      "Zeron CPU"
  author:     "fruzino"
  discord:    ""
  description: "Dual-core 8-bit custom Verilog CPU"
  language:   "Verilog"
  clock_hz:   50000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "2x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_fruzinofruzino_zeron_cpu"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "prog_addr[0]"
  ui[1]: "prog_addr[1]"
  ui[2]: "prog_addr[2]"
  ui[3]: "prog_addr[3]"
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: "prog_we"

  # Outputs
  uo[0]: "gpio[0]"
  uo[1]: "gpio[1]"
  uo[2]: "gpio[2]"
  uo[3]: "gpio[3]"
  uo[4]: "gpio[4]"
  uo[5]: "gpio[5]"
  uo[6]: "gpio[6]"
  uo[7]: "gpio[7]"

  # Bidirectional pins
  uio[0]: "gpio[8]"
  uio[1]: "gpio[9]"
  uio[2]: "gpio[10]"
  uio[3]: "gpio[11]"
  uio[4]: "gpio[12]"
  uio[5]: "gpio[13]"
  uio[6]: "gpio[14]"
  uio[7]: "gpio[15]"

# Do not change!
yaml_version: 6
